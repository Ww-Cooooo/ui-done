# Optional OpenAI host adapter. The vendor-neutral runtime contract lives in ../SKILL.md.
interface:
  display_name: "UI Done"
  short_description: "持续负责 React 前端调研、设计、代码改动与真实浏览器验收"
  default_prompt: "Use $ui-done whenever frontend scope exists or emerges during Agent work, even when the user did not name the Skill, and keep it governing research, planning, code additions, changes, deletions, refactoring, cleanup, QA, packaging, and handoff. Explicitly pass $ui-done into every authorized frontend subtask. Require React, an Ant Design-first primary UI system, and an inclusion-first plan with real shipped roles for motion, Lenis, separate 2D Canvas, AntV-first visualization when authentic data exists, icons/assets, performance, and real-browser verification on computer, tablet, and phone. Evaluate true 3D/WebGL on every substantial surface, but adopt Three.js through R3F only when the natural-host, inherently-spatial, unique-value, and finishable-quality gates all pass; otherwise omit WebGL cleanly and record the specific failed gate. Before selecting or implementing a source, inspect its relevant official demos, adapt useful demo behavior to the product tone, and record adoption, rejection, or a hard no-view exemption."

policy:
  allow_implicit_invocation: true
