name: 安装或使用问题
description: 安装失败、Agent 找不到 UI Done，或者实际结果不对
title: "[问题] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        不用写得很正式。把你做了什么、哪里卡住说清楚就行。

        如果报错里有 API Key、Token、Cookie、密码或个人信息，请先删掉再提交。

  - type: dropdown
    id: agent
    attributes:
      label: 你在用哪个 Agent？
      options:
        - Codex
        - Claude Code
        - Cursor
        - 其他 Agent
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 你是怎么安装的？
      options:
        - npx 命令
        - 让 Agent 按 INSTALL.md 安装
        - 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 出问题前，你做了什么？
      description: 按先后顺序写就行，命令和提示词可以直接粘贴。
      placeholder: |
        1. 我先……
        2. 然后……
        3. 接着出现了问题
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 你看到了什么？
      description: 请粘贴完整报错，或者把截图拖进来。记得先删掉私密信息。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你原本希望怎样？
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Agent 版本和电脑系统
      description: 知道就写，不知道可以留空。
      placeholder: 例如：Codex，Windows 11

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已经删掉 API Key、Token、Cookie、密码和其他私密信息。
          required: true
